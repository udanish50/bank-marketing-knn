[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-marketing-knn"
version = "0.1.0"
description = "Manual KNN classifier for the UCI Bank Marketing dataset."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Muhammad Umair Danish" }
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13"
]

[tool.setuptools.packages.find]
where = ["src"]
